def reactNativeGradlePlugin = file("../node_modules/@react-native/gradle-plugin")
if (!reactNativeGradlePlugin.exists()) {
    throw new org.gradle.api.GradleException("""
        React Native Gradle plugin not found at: ${reactNativeGradlePlugin.absolutePath}
        Run 'npm install' in the mobile folder first, then sync again.
        From project root:  cd mobile && npm install
    """.stripIndent())
}
pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
}
plugins {
    id("com.facebook.react.settings")
}
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = "Naxtap"
include(":app")
includeBuild("../node_modules/@react-native/gradle-plugin")
